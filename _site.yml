name: "EV5020"
output_dir: "docs"
navbar:
  title: "EV5020"
  icon: fa-home
  left:
    - text: "Home"
      icon: fa-home
      href: index.html
    - text: "Setup"
      icon: fa-cog
      href: setup.html
    - text: "Learn"
      icon: fa-desktop
      menu:
        - text: "How-to"
          icon: fa-tv
          href: howto.html
    - text: "R Book"
      icon: fa-book
      menu:
        - text: "Web book"
          icon: fa-firefox
          href: https://intro2r.com
        - text: "----"
        - text: "PDF book"
          icon: fa-file-pdf
          href: https://github.com/alexd106/Rbook/raw/master/docs/Rbook.pdf
    - text: "Exercises"
      icon: fa-book
      href: exercises.html
    - text: "Exercise Solutions"
      icon: fa-book
      href: exercise_solutions.html
    - text: "Data"
      icon: fa-download
      href: "data.html"
    - text: "Info"
      icon: fa-question-circle
      menu:
        - text: "Resources"
          icon: fa-book
          href: "resources.html"
        - text: "Source code"
          icon: fa-github fa-lg
          href: https://github.com/alexd106/BI5009

output:
  html_document:
    theme: flatly
    highlight: tango
    toc: true
    toc_depth: 2
    toc_float:
      collapsed: false
    fig_align: center
    math_method: r-katex
    includes:
    # css: 'styles.css'
    # css:
    #  - https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css
    #  - styles.css

# Anything listed here stays out of the rendered site in docs/.
# GLM_archive is retired teaching material; plan/, Intro_and_questions and the
# course_*_message files are private working notes and must never be published
exclude: ["LICENSE", "README.md", "*.Rproj", "*.key", "*.psd",
          "GLM_archive", "rmd_archive", "plan", "Intro_and_questions",
          "course_welcome_message", "course_end_message", "output"]

# Dotfiles are not treated as site resources, so .nojekyll has to be named
# explicitly or a full render_site() would leave docs/ without it
include: [".nojekyll"]